services:
  cyberbrain:
    build:
      context: .
    container_name: cyberbrain
    restart: unless-stopped
    command: ["python", "-m", "cyberbrain.api.main"]
    ports:
      - "8767:8767"
    environment:
      CYBERBRAIN_HOST: 0.0.0.0
      CYBERBRAIN_PORT: 8767
      CYBERBRAIN_QDRANT_URL: http://qdrant:6333
      CYBERBRAIN_QDRANT_API_KEY: ${CYBERBRAIN_QDRANT_API_KEY:-}
      CYBERBRAIN_KNOWLEDGE_COLLECTION: cyberbrain_knowledge
      CYBERBRAIN_EPISODIC_COLLECTION: cyberbrain_episodic
      CYBERBRAIN_EMBEDDING_URL: http://embedding:11434
      CYBERBRAIN_EMBEDDING_MODEL: nomic-embed-text
      CYBERBRAIN_EMBEDDING_DIMENSION: 768
      CYBERBRAIN_EMBEDDING_VERSION: nomic-embed-text@v1
      CYBERBRAIN_MCP_AUTH_TOKEN: ${CYBERBRAIN_MCP_AUTH_TOKEN:?CYBERBRAIN_MCP_AUTH_TOKEN is required}
      CYBERBRAIN_REQUIRE_AUTH: "true"
      CYBERBRAIN_KNOWLEDGE_EVOLUTION_LOCK_FILE: /data/knowledge_evolution.lock
    volumes:
      - ./TOOL_GUIDE.md:/app/TOOL_GUIDE.md:ro
      - cyberbrain-data:/data
    depends_on:
      qdrant:
        condition: service_started
      embedding-init:
        condition: service_completed_successfully

  dream-worker:
    build:
      context: .
    restart: unless-stopped
    profiles: ["dreaming"]
    command: ["python", "-m", "cyberbrain.dreaming.main"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      CYBERBRAIN_QDRANT_URL: http://qdrant:6333
      CYBERBRAIN_QDRANT_API_KEY: ${CYBERBRAIN_QDRANT_API_KEY:-}
      CYBERBRAIN_KNOWLEDGE_COLLECTION: cyberbrain_knowledge
      CYBERBRAIN_EPISODIC_COLLECTION: cyberbrain_episodic
      CYBERBRAIN_EMBEDDING_URL: http://embedding:11434
      CYBERBRAIN_EMBEDDING_MODEL: nomic-embed-text
      CYBERBRAIN_EMBEDDING_DIMENSION: 768
      CYBERBRAIN_EMBEDDING_VERSION: nomic-embed-text@v1
      CYBERBRAIN_MCP_AUTH_TOKEN: ${CYBERBRAIN_MCP_AUTH_TOKEN:?CYBERBRAIN_MCP_AUTH_TOKEN is required}
      CYBERBRAIN_REQUIRE_AUTH: "true"
      CYBERBRAIN_KNOWLEDGE_EVOLUTION_LOCK_FILE: /data/knowledge_evolution.lock
      CYBERBRAIN_DREAM_QUEUE_DB: /data/dream_queue.sqlite
      CYBERBRAIN_DREAM_AUDIT_DB: /data/dream_audit.sqlite
      CYBERBRAIN_DREAM_REASONER_URL: ${CYBERBRAIN_DREAM_REASONER_URL:-}
      CYBERBRAIN_DREAM_REASONER_TOOL: ${CYBERBRAIN_DREAM_REASONER_TOOL:-reason_task}
      CYBERBRAIN_DREAM_REASONER_BEARER_TOKEN: ${CYBERBRAIN_DREAM_REASONER_BEARER_TOKEN:-}
      CYBERBRAIN_DREAM_REASONER_API_KEY: ${CYBERBRAIN_DREAM_REASONER_API_KEY:-}
      CYBERBRAIN_DREAM_WORKER_POLL_SECONDS: ${CYBERBRAIN_DREAM_WORKER_POLL_SECONDS:-2}
      CYBERBRAIN_DREAM_WORKER_MAX_ATTEMPTS: ${CYBERBRAIN_DREAM_WORKER_MAX_ATTEMPTS:-3}
    volumes:
      - cyberbrain-data:/data
    depends_on:
      qdrant:
        condition: service_started
      embedding-init:
        condition: service_completed_successfully

  reasoner:
    build:
      context: .
    restart: unless-stopped
    profiles: ["reasoner"]
    command: ["python", "-m", "cyberbrain.reasoner_provider.main"]
    expose:
      - "8770"
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      REASONER_HOST: 0.0.0.0
      REASONER_PORT: 8770
      REASONER_AUTH_TOKEN: ${REASONER_AUTH_TOKEN:-}
      REASONER_REQUIRE_AUTH: ${REASONER_REQUIRE_AUTH:-true}
      REASONER_BACKEND: ${REASONER_BACKEND:-ollama}
      REASONER_OLLAMA_URL: ${REASONER_OLLAMA_URL:-}
      REASONER_OLLAMA_MODEL: ${REASONER_OLLAMA_MODEL:-}
      REASONER_OLLAMA_TIMEOUT_SECONDS: ${REASONER_OLLAMA_TIMEOUT_SECONDS:-120}
      REASONER_OLLAMA_NUM_PREDICT: ${REASONER_OLLAMA_NUM_PREDICT:-700}

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: cyberbrain-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${CYBERBRAIN_QDRANT_API_KEY:-}

  embedding:
    image: ollama/ollama:0.32.6
    container_name: cyberbrain-embedding
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  embedding-init:
    image: ollama/ollama:0.32.6
    container_name: cyberbrain-embedding-init
    restart: "no"
    environment:
      OLLAMA_HOST: http://embedding:11434
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull nomic-embed-text
    depends_on:
      - embedding

volumes:
  qdrant-data:
  ollama-data:
  cyberbrain-data:
