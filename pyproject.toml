[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cyberbrain"
dynamic = ["version"]
description = "Portable knowledge, episodic memory, and dreaming infrastructure for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MPL-2.0" }
authors = [{ name = "CyberBrain contributors" }]
dependencies = [
  "httpx>=0.28,<0.29",
  "mcp>=1.30,<2",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "starlette>=0.46,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[tool.hatch.version]
path = "cyberbrain/_version.py"

[tool.hatch.build]
# VCS-local excludes are not a distribution privacy boundary.
exclude = ["/_private", "/_private/**"]

[tool.hatch.build.targets.wheel]
packages = ["cyberbrain"]

[tool.hatch.build.targets.wheel.force-include]
"TOOL_GUIDE.md" = "cyberbrain/TOOL_GUIDE.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
