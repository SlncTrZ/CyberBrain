# SPDX-License-Identifier: MPL-2.0
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and QA tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Build Python distributions
        run: python -m build

      - name: Verify package version authority
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import cyberbrain

          installed_version = version("cyberbrain")
          assert installed_version == cyberbrain.__version__
          print(cyberbrain.__version__)
          PY

      - name: Validate Compose
        env:
          CYBERBRAIN_MCP_AUTH_TOKEN: ci-placeholder-token
          CYBERBRAIN_DREAM_REASONER_BEARER_TOKEN: ci-placeholder-reasoner-token
        run: |
          docker compose config --quiet
          docker compose --profile dreaming config --quiet
          docker compose -f docker-compose.integration.yml config --quiet

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release image
        run: docker build -t cyberbrain:ci .

      - name: Verify image package
        run: |
          docker run --rm cyberbrain:ci python -c \
            "import cyberbrain; print('cyberbrain='+cyberbrain.__version__)"
